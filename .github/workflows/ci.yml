name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start FastAPI backend
        env:
          MONGODB_URI: mongodb://localhost:27017
          DB_NAME: payment_reconciliation_db
        run: |
          nohup uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
          sleep 5

      - name: Check backend health
        run: |
          curl --fail http://localhost:8000/api/dashboard/summary

      - name: Run full system tests
        env:
          MONGODB_URI: mongodb://localhost:27017
          DB_NAME: payment_reconciliation_db
        run: |
          python full_system_test.py